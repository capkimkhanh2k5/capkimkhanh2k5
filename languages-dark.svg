<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="100%" height="100%">
  <defs>
    <style>
      .card { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 6; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #f0f6fc; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; }
      .bar-bg { fill: #21262d; rx: 4; }
      .bar-fill-vi { fill: url(#grad-vi); rx: 4; }
      .bar-fill-en { fill: url(#grad-en); rx: 4; }
      .divider { stroke: #30363d; stroke-width: 1; }
      .badge-bg-vi { fill: rgba(16, 185, 129, 0.15); stroke: rgba(16, 185, 129, 0.4); stroke-width: 1; rx: 4; }
      .badge-bg-en { fill: rgba(14, 165, 233, 0.15); stroke: rgba(14, 165, 233, 0.4); stroke-width: 1; rx: 4; }
    </style>
    <linearGradient id="grad-vi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-en" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="798" height="88" x="1" y="1" class="card" />

  <!-- VIETNAMESE -->
  <g transform="translate(32, 16)">
    <text x="0" y="14" class="title">🇻🇳 Tiếng Việt (Vietnamese)</text>
    <text x="0" y="34" class="desc">Bản ngữ · Native Speaker</text>
    
    <rect x="245" y="0" width="95" height="20" class="badge-bg-vi" />
    <text x="292" y="14" text-anchor="middle" class="badge-text" fill="#10b981">100% Native</text>

    <rect x="0" y="46" width="340" height="7" class="bar-bg" />
    <rect x="0" y="46" width="340" height="7" class="bar-fill-vi" />
  </g>

  <!-- DIVIDER -->
  <line x1="400" y1="12" x2="400" y2="76" class="divider" />

  <!-- ENGLISH -->
  <g transform="translate(428, 16)">
    <text x="0" y="14" class="title">🇬🇧 English</text>
    <text x="0" y="34" class="desc">Professional Working · CEFR C1</text>
    
    <rect x="230" y="0" width="110" height="20" class="badge-bg-en" />
    <text x="285" y="14" text-anchor="middle" class="badge-text" fill="#0ea5e9">TOEIC 865/990</text>

    <rect x="0" y="46" width="340" height="7" class="bar-bg" />
    <rect x="0" y="46" width="296" height="7" class="bar-fill-en" />
  </g>
</svg>
