<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 175" width="100%" height="100%">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #1f2328; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #57606a; }
      .meta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #656d76; }
    </style>
  </defs>

  <rect width="348" height="173" x="1" y="1" class="card" />

  <!-- HEADER: SINGLE COLOR VECTOR ICON + TITLE -->
  <g transform="translate(20, 18)">
    <!-- Single Color Vector Icon -->
    <g transform="translate(0, 0)">
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Title -->
    <text x="32" y="16" class="title">JOBIO</text>
  </g>

  <!-- REDIRECT / EXTERNAL LINK ICON (EXACT MATCH TO REFERENCE) -->
  <g transform="translate(308, 18) scale(0.75)" stroke="#656d76" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
    <polyline points="15 3 21 3 21 9" />
    <line x1="10" y1="14" x2="21" y2="3" />
  </g>

  <!-- DESCRIPTION (ENGLISH & ESCAPED) -->
  <text x="20" y="66" class="desc">An intelligent recruitment &amp; talent tracking platform</text>
  <text x="20" y="85" class="desc">built with Django, React and PostgreSQL.</text>

  <!-- TECH STACK PILLS -->
    <rect x="20" y="108" width="60" height="22" rx="11" fill="#ddf4ff" />
    <text x="50.0" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0969da">Python</text>
    <rect x="88" y="108" width="60" height="22" rx="11" fill="#d2f9d8" />
    <text x="118.0" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#116329">Django</text>
    <rect x="156" y="108" width="53" height="22" rx="11" fill="#e0f2fe" />
    <text x="182.5" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0284c7">React</text>
    <rect x="217" y="108" width="88" height="22" rx="11" fill="#ddf4ff" />
    <text x="261.0" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0969da">PostgreSQL</text>

  <!-- METRICS FOOTER -->
  <g transform="translate(20, 146)">
    <!-- Star -->
    <path d="M7 .25a.75.75 0 0 1 .673.418l1.647 3.338 3.684.536a.75.75 0 0 1 .416 1.279l-2.666 2.598.63 3.668a.751.751 0 0 1-1.088.791L7 10.879l-3.296 1.733a.75.75 0 0 1-1.088-.79l.63-3.67L.58 5.82a.75.75 0 0 1 .416-1.28l3.684-.535L6.327.668A.75.75 0 0 1 7 .25Z" fill="#656d76"/>
    <text x="18" y="10" class="meta">0</text>
    
