    <g transform="translate(54, 0)">
      <path d="M4.5 2.5a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 1.857a2.25 2.25 0 1 0-1.5 0v.768A2.25 2.25 0 0 0 5.25 7.375h3.5A2.25 2.25 0 0 0 11 5.125V4.357a2.25 2.25 0 1 0-1.5 0v.768a.75.75 0 0 1-.75.75h-3.5A.75.75 0 0 1 4.5 5.125V4.357ZM9.5 2.5a.75.75 0 1 1 1.5 0 .75.75 0 0 1-1.5 0ZM5.5 10.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm-2 1a2.25 2.25 0 1 1 2.75 2.186v.564a.75.75 0 0 1-1.5 0v-.564A2.25 2.25 0 0 1 3.5 11.5Z" fill="#656d76"/>
