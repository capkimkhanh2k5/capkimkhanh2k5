<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 36" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #1f2328; }
      .link { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #0969da; }
    </style>
  </defs>

  <!-- Left: Featured Projects (No frame, no border) -->
  <text x="0" y="25" class="title">Featured Projects</text>

  <!-- Right: View all repositories -> (Small text on far right edge) -->
  <text x="1000" y="25" text-anchor="end" class="link">View all repositories &#8594;</text>
</svg>